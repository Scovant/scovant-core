name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - run: pip install ".[dev]"
      - run: ruff check src tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - run: pip install ".[dev,mcp]"
      - run: mypy src

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ['3.12', '3.13'] }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '${{ matrix.python }}' }
      - run: pip install ".[dev]"
      - run: pytest -q -m "not security and not golden and not mcp" --cov=scovant_core --cov-report=term-missing --cov-fail-under=90

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - run: pip install ".[dev]"
      - run: pytest -q -m security

  golden:
    # Matrixed like `tests`: goldens are byte-compared rendering output, so an
    # interpreter/stdlib difference is exactly the class of change they exist
    # to catch — running them on one version only would let 3.13 drift.
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ['3.12', '3.13'] }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '${{ matrix.python }}' }
      - run: pip install ".[dev]"
      - run: pytest -q -m golden

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - run: pip install ".[dev]" build
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: dist, path: dist }

  cli-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: dist, path: dist }
      - run: pip install dist/*.whl
      - run: scovant --version
      - run: scovant scan --help
      - name: Start the fixture server
        run: |
          python -m tests._fixture_server commerce-good 8765 &
          ready=0
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8765/ >/dev/null && { ready=1; break; }
            sleep 0.5
          done
          [[ "$ready" == "1" ]] || { echo "fixture server did not start" && exit 1; }
      - name: Scan the fixture server
        run: |
          set +e
          scovant scan http://127.0.0.1:8765/ --allow-private-networks --format json --output /tmp/r.json
          code=$?
          set -e
          [[ ${code:-0} -le 1 ]]
      - name: Assert score and grade
        run: |
          python -c "import json; d = json.load(open('/tmp/r.json')); assert d['score']['value'] == 90 and d['score']['grade'] == 'A', d['score']"

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - run: pip install ".[dev,mcp]"
      - run: pytest -q -m mcp

  npm:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with: { node-version: '20' }
      - name: Version is derived from pyproject, not typed
        run: |
          node npm/scripts/sync-version.mjs
          git diff --exit-code npm/package.json
      - name: Launcher smoke tests
        run: node --test npm/test
