name: Action smoke test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - name: Start the fixture server
        run: |
          python -m tests._fixture_server commerce-good 8765 &
          ready=0
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8765/ >/dev/null && { ready=1; break; }
            sleep 0.5
          done
          [[ "$ready" == "1" ]] || { echo "fixture server did not start" && exit 1; }
      # 100/A is unreachable here: CORE-ACCESS-001 requires the final URL to
      # be served over HTTPS (this is a plain-http loopback target), and
      # CORE-ACCESS-007/CORE-OPERABILITY-004 fail because commerce-good's
      # canonical/references are hardcoded to https://example.com. 90/A is
      # the expected value today; the gate is set to 85 so it still exercises
      # a real (passing) threshold check rather than always being a no-op.
      - name: Scan the fixture server
        id: scan
        uses: ./
        with:
          url: http://127.0.0.1:8765/
          allow-private-networks: 'true'
          trusted-target: 'true'
          min-core-score: '85'
      - name: Assert outputs
        run: |
          set -euo pipefail
          (( "${{ steps.scan.outputs.score }}" >= 85 ))
          [[ "${{ steps.scan.outputs.grade }}" == "A" ]]
          # The action's own "out" step already wrote the step summary — but
          # into ITS OWN step's summary file. GitHub gives every step a
          # fresh, separate GITHUB_STEP_SUMMARY, so reading that variable
          # from THIS step is always empty. Re-render the summary here, from
          # the same raw report the action produced (RUNNER_TEMP/core.json,
          # the action's own convention — see action.yml's "out" step), into
          # a file this step owns, by ASSIGNING a fresh value to the
          # variable rather than reading the inherited (empty) one.
          own_summary="$RUNNER_TEMP/assert-outputs-summary.md"
          GITHUB_STEP_SUMMARY="$own_summary" python -m scovant_core.action summary "$RUNNER_TEMP/core.json"
          grep -q "Static Signal Score:" "$own_summary"
