name: Audit

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - run: pip install ".[mcp]"
      - name: Freeze the resolved dependency set (excludes the local package)
        # The audit tool lives in its OWN venv: installing pip-audit next to
        # the package would put its ~39-package dependency tree (requests,
        # urllib3, cachecontrol, rich, …) into the very environment that is
        # frozen below, so the workflow would audit the tool instead of the
        # package and go red over advisories in software this package does
        # not ship. Same two-venv split the monorepo's release pipeline uses.
        run: |
          set -euo pipefail
          pip freeze --exclude-editable | grep -v '^scovant-core' > /tmp/deps.txt
          python -m venv /tmp/tool-venv
          /tmp/tool-venv/bin/pip install pip-audit==2.10.1
      - run: /tmp/tool-venv/bin/pip-audit --strict --requirement /tmp/deps.txt
