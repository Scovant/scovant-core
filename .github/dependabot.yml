version: 2
updates:
  - package-ecosystem: pip
    directory: /
    # constraints/constraints-<version>.txt are frozen release snapshots
    # (what a clean install resolved to on release day) — never bump them.
    exclude-paths: ["constraints/**"]
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
