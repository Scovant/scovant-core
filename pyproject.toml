[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "scovant-core"
version = "0.3.1"
description = "Open-source, evidence-first scanner for passive AI-agent readiness signals."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Scovant", email = "bot@scovant.com" }]
keywords = ["ai-agents", "robots.txt", "llms.txt", "mcp", "structured-data", "scanner"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Site Management",
]
dependencies = [
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "lxml>=5.2,<7",
  "tldextract>=5,<6",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff==0.16.7", "jsonschema>=4.20,<5", "mypy==2.3.1", "twine>=5,<8", "pyyaml>=6,<7"]
mcp = ["mcp>=1.28,<3"]

[project.scripts]
scovant = "scovant_core.cli:main"

[project.urls]
Homepage = "https://github.com/Scovant/scovant-core"
Documentation = "https://github.com/Scovant/scovant-core/tree/main/docs"
Changelog = "https://github.com/Scovant/scovant-core/blob/main/CHANGELOG.md"
"Scovant Cloud" = "https://scovant.com/?utm_source=scovant-core&utm_medium=pypi&utm_campaign=oss"

[tool.hatch.build.targets.wheel]
packages = ["src/scovant_core"]
# Pinned below the hatchling default (2.5 as of 1.32) — twine<7 (pinned in the
# dev extra) can't parse a 2.5 METADATA file yet (hatchling's own 1.30.0 was
# yanked from PyPI for exactly this: "some major projects like twine do not
# yet support it"). 2.4 is what every hatchling from 1.27 through today's
# non-yanked releases already emits by default, so this is a floor, not a
# downgrade.
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "fixtures/", "docs/", "constraints/", "README.md", "LICENSE", "CHANGELOG.md", "THIRD_PARTY_NOTICES.md", "pyproject.toml", "SECURITY.md", "CONTRIBUTING.md", "CODE_OF_CONDUCT.md", "CITATION.cff", "SUPPORT.md"]
core-metadata-version = "2.4"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
  "security: SSRF / redirect / size-cap / rebinding regressions (run as the CI 'security' job)",
  "golden: byte-compared fixture reports",
  "mcp: needs the optional [mcp] extra",
]

[tool.coverage.run]
source = ["scovant_core"]
relative_files = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["bs4", "bs4.*", "lxml", "lxml.*", "tldextract", "tldextract.*"]
ignore_missing_imports = true

# `scovant_core.compat` imports an optional embedding host's exception class,
# which is not a dependency of this package: absent in this package's own CI
# venv, present in an embedding application's checkout. Disabling the import
# diagnostics for that one module (rather than an inline `type: ignore`, which
# `warn_unused_ignores` then flags wherever the host package is absent) makes
# `mypy src` clean in both environments.
[[tool.mypy.overrides]]
module = ["scovant_core.compat"]
disable_error_code = ["import-not-found", "import-untyped"]
